<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>빌라드알티오라 길찾기</title>

<style>
html,body{margin:0;background:#fffaf7;color:#28231f}
body{font-family:Arial,'Noto Sans KR',sans-serif}
.wrap{max-width:520px;margin:auto;padding:42px 24px;text-align:center}
.mark{font-size:13px;letter-spacing:2px;color:#9b806c;margin-bottom:12px}
.title{font-size:27px;font-weight:700;margin:0 0 10px}
.addr{font-size:14px;color:#777;margin-bottom:30px}
.btn{display:block;text-decoration:none;margin:12px 0;padding:17px 18px;border:1px solid #e2d7cf;border-radius:14px;background:white;color:#28231f;font-size:16px;font-weight:600;box-shadow:0 3px 12px rgba(0,0,0,.04)}
.sub{display:block;font-size:12px;color:#999;font-weight:400;margin-top:5px}
</style>

<script>
function openTmap(e){
  e.preventDefault();

  var name='빌라드알티오라';
  var x='127.38886068875';
  var y='36.358095108905';

  var ua=navigator.userAgent||'';
  var ios=/iPhone|iPad|iPod/i.test(ua);
  var android=/Android/i.test(ua);

  var app=ios
    ? 'tmap://route?rGoName='+encodeURIComponent(name)+'&rGoX='+x+'&rGoY='+y
    : 'intent://route?goalname='+encodeURIComponent(name)+'&goalx='+x+'&goaly='+y+'#Intent;scheme=tmap;package=com.skt.tmap.ku;end';

  var web='https://www.tmap.co.kr/tmap2/mobile/search.jsp?name='+encodeURIComponent(name+' 대전 서구 한밭대로 809');

  var hidden=false;

  var onHide=function(){
    hidden=true;
    document.removeEventListener('visibilitychange',onHide);
  };

  document.addEventListener('visibilitychange',onHide);

  if(android||ios){
    window.location.href=app;

    setTimeout(function(){
      if(!hidden){
        window.location.href=web;
      }
    },1800);

  }else{
    window.open(web,'_blank');
  }
}
</script>

</head>

<body>

<main class="wrap">

<div class="mark">WEDDING LOCATION</div>

<h1 class="title">빌라드알티오라</h1>

<div class="addr">
대전광역시 서구 한밭대로 809<br>
사학연금회관 2–3층
</div>

<a
class="btn"
href="https://map.naver.com/p/search/%EB%B9%8C%EB%9D%BC%EB%93%9C%EC%95%8C%ED%8B%B0%EC%98%A4%EB%9D%BC"
target="_blank"
rel="noopener noreferrer">
네이버지도
<span class="sub">네이버지도로 길찾기</span>
</a>

<a
class="btn"
href="https://www.tmap.co.kr/tmap2/mobile/search.jsp?name=%EB%B9%8C%EB%9D%BC%EB%93%9C%EC%95%8C%ED%8B%B0%EC%98%A4%EB%9D%BC%20%EB%8C%80%EC%A0%84%20%EC%84%9C%EA%B5%AC%20%ED%95%9C%EB%B0%AD%EB%8C%80%EB%A1%9C%20809"
onclick="openTmap(event)">
티맵
<span class="sub">티맵 앱으로 길찾기</span>
</a>

<a
class="btn"
href="https://map.kakao.com/?q=%EB%B9%8C%EB%9D%BC%EB%93%9C%EC%95%8C%ED%8B%B0%EC%98%A4%EB%9D%BC"
target="_blank"
rel="noopener noreferrer">
카카오맵
<span class="sub">카카오맵으로 길찾기</span>
</a>

</main>

</body>
</html>
